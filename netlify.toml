# ══════════════════════════════════════════════════════════════════
#  Build
# ══════════════════════════════════════════════════════════════════
[build]
  publish = "public"
  command = "hugo --gc --minify"

[build.environment]
  HUGO_VERSION = "0.156.0"
  TZ = "Asia/Ho_Chi_Minh"

# Deploy preview và branch deploy dùng URL tạm, phải ghi đè baseURL
[context.deploy-preview]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"
[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

# ══════════════════════════════════════════════════════════════════
#  Bảo mật — header áp cho mọi trang
# ══════════════════════════════════════════════════════════════════
[[headers]]
  for = "/*"
  [headers.values]
    # Trang này KHÔNG có JavaScript. default-src 'none' chặn mọi thứ,
    # rồi mở lại đúng những gì cần. Nếu sau này thêm JS, bổ sung script-src.
    Content-Security-Policy = "default-src 'none'; img-src 'self' data:; style-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"

    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "DENY"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy   = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()"

# CSS đã có fingerprint trong tên file nên cache vĩnh viễn được
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
